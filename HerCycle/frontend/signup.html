<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | HerCycle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <a href="index.html" class="logo">Her<span>Cycle</span></a>

        <div class="auth-card">

            <h1>Create Your Account</h1>
            <p class="auth-subtitle">
                Start your journey towards better health awareness.
            </p>

            <form id="signupForm">

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" minlength="8" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>

                <label>Choose Your Account Type</label>

                <div class="role-options">
                    <label class="role-card">
                        <input type="radio" name="role" value="girl" required>
                        <span>🌸 Girl</span>
                        <small>Period tracking and personal health</small>
                    </label>

                    <label class="role-card">
                        <input type="radio" name="role" value="boy">
                        <span>💙 Boy</span>
                        <small>Menstrual health awareness and learning</small>
                    </label>
                </div>

                <button type="submit" class="auth-submit">
                    Create Account
                </button>

                <p id="signupMessage" class="form-message"></p>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

        <p class="auth-footer">
            Your health information deserves privacy and care. 💗
        </p>

    </div>
    
    
    

    <script src="script.js"></script>
    <script src="app.js"></script>
</body>
</html>
